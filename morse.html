
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Press Duration</title>
</head>
<body>
  <button id="myButton">Hold me</button>
  <p id="output"></p>

  <script>
    const button = document.getElementById('myButton');
    const output = document.getElementById('output');

    let pressStartTime;

    // When the button is pressed
    button.addEventListener('mousedown', () => {
      pressStartTime = Date.now(); // Record the time the button was pressed
    });

    // When the button is released
    button.addEventListener('mouseup', () => {
      if (pressStartTime) {
        const pressDuration = Date.now() - pressStartTime; // Calculate the duration
        output.textContent = `Button was pressed for ${pressDuration} milliseconds.`;
      }
    });
  </script>
</body>
</html>
