<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Letter Generator</title>
	<style>
        #letterDisplay {
            color: pink;
            font-size: 48px; /* Adjust size as needed */
        }
    </style>
</head>
<body style="background-color: #000000;">
    <h2 id="letterDisplay">one</h2>
    <button id="generateButton">Ameliana</button>
    <h2 id="morseDisplay">two</h2>
    <script>
	document.getElementById('generateButton').addEventListener('click', function() {
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const morse = '.-   -... -.-. -..  .    ..-. --.  .... ..   .--- -.-  .-.. --   -.   ---  .--. --.- .-.  ...  -    ..-  ...- .--  -..- -.-- --..' 
    const randomIndex = Math.floor(Math.random() * letters.length);
    const randomLetter = letters[randomIndex];
    const randomMorse = morse.substring(randomIndex*5, randomIndex*5+4);
    
    document.getElementById('letterDisplay').textContent = randomLetter;
    document.getElementById('morseDisplay').textContent = randomMorse;
})
	</script>
</body>
</html>
